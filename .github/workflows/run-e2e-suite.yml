# Runs the Quickstart E2E suite: a ThunderID server, the provisioned test application and user,
# the sample built onto an emulator, and the Maestro flows driving it.
#
# Shared by the PR builder and the nightly workflow so the two cannot drift. All of the actual
# work lives in tests/e2e/run-e2e.sh, which is also what a contributor runs locally, so a green
# run here and a green run on a laptop mean the same thing.
#
# This is a reusable workflow rather than a composite action so that the emulator step below can
# carry its own timeout-minutes - composite action steps don't support that field, which means a
# hung emulator teardown would otherwise eat the whole job's timeout and force the job's
# conclusion to `cancelled` no matter what a later step determines.

name: Run E2E Suite

on:
  workflow_call:
    inputs:
      thunderid-version:
        description: ThunderID release to test against, without the leading "v". Defaults to the latest release.
        required: false
        type: string
        default: ""
      artifact-suffix:
        description: Appended to the debug artifact name, so concurrent callers do not collide.
        required: false
        type: string
        default: ""

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🗄️ Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🧭 Install Maestro
        shell: bash
        # Pinned rather than latest: an unpinned install swaps the test runner out from under the
        # suite between runs, so a CI failure cannot be reproduced against the version a
        # contributor has locally. Bump this deliberately, after checking the flows against it.
        env:
          MAESTRO_VERSION: "2.9.0"
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 🖥️ Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🔬 Run E2E Suite
        # reactivecircus/android-emulator-runner has been observed to report its own step outcome
        # as `cancelled` during emulator teardown regardless of whether run-e2e.sh actually
        # succeeded - including on a run where Maestro's own console output read "2/2 Flows
        # Passed". Continue past that unreliable conclusion and determine the real outcome from
        # run-e2e.sh's own JUnit report in the next step instead, so a genuine pass shows green.
        #
        # The same teardown can also hang outright rather than just mis-reporting: `adb emu kill`
        # returns before the emulator process actually exits, and the step then sits idle. Bound
        # it well under the job timeout so a hung teardown still leaves time for Check E2E Result
        # to read report.xml and report the real outcome, instead of the job dying at 45 minutes
        # with a bare cancellation and no result.
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2
        env:
          THUNDERID_VERSION: ${{ inputs.thunderid-version }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The script starts at the repository root.
          script: cd tests/e2e && ./run-e2e.sh

      - name: ✅ Check E2E Result
        # Always run this, even if the step above reported failure/cancelled (see its comment) -
        # the real result comes from run-e2e.sh's own JUnit report, not that step's conclusion. A
        # missing report means something failed before Maestro ever ran (the build, provisioning,
        # the server itself, or a teardown hang eating the step's own timeout), which is just as
        # much a real failure as a failing testcase inside the report is.
        if: always()
        shell: bash
        run: |
          report="tests/e2e/report.xml"
          if [ ! -f "$report" ]; then
            echo "::error::$report was not produced - the suite failed before Maestro could run."
            exit 1
          fi
          failures=$(grep -o 'failures="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
          if [ "${failures:-1}" != "0" ]; then
            echo "::error::$failures Maestro flow(s) failed - see the debug artifact for screenshots."
            exit 1
          fi
          echo "All Maestro flows passed."

      - name: 📤 Upload Debug Artifacts
        # Maestro writes its debug output, and run-e2e.sh generates the JUnit report, regardless of
        # which of the two steps above actually failed - collect on either.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-debug-android${{ inputs.artifact-suffix }}
          # Maestro writes screenshots, the recorded hierarchy and its own logs here on failure,
          # which is the only way to tell a genuine regression from a flake after the fact.
          path: |
            ~/.maestro/tests
            tests/e2e/report.xml
            tests/e2e/.thunderid-server/server.log
          retention-days: 7
          if-no-files-found: ignore
