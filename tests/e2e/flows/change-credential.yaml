appId: dev.thunderid.Quickstart
name: Change password from Manage Account
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow actually changes E2E_PASSWORD on the shared E2E user via the real backend (the
  # self-service credential write path has no "current value" concept to gate this behind), so it
  # changes to this value and back to E2E_PASSWORD before finishing. If this flow fails between
  # those two steps, the E2E user is left on this password until the next run fixes it, not
  # E2E_PASSWORD - see the closing comment for how a re-run recovers on its own.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml

- tapOn: "Sign in"

# The credentials step is rendered from the flow definition the server returns, not from static
# native views. The SDK tags each input with the field's identifier and each button with the
# action's ref, so these ids track the server's flow response.
#
# Compose keeps testTag inside its own semantics tree, so these ids are only visible to Maestro
# because the SDK opts the subtree in via testTagsAsResourceId.
- extendedWaitUntil:
    visible:
      id: "thunderid-field-username"
    timeout: 25000

- tapOn:
    id: "thunderid-field-username"
- inputText: ${E2E_USERNAME}

- tapOn:
    id: "thunderid-field-password"
- inputText: ${E2E_PASSWORD}

- tapOn:
    id: "thunderid-action-action_001"

- extendedWaitUntil:
    visible: "Session active"
    timeout: 30000

# See signin.yaml's equivalent comment: the home screen's own recomposition (a live "expires in"
# countdown) can reset the scroll position in the gap between scrollUntilVisible finding an
# element and the tap landing, so this is wrapped in a retry.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element: "Manage Account"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: "Manage Account"

- extendedWaitUntil:
    visible: "Change Password"
    timeout: 20000

# Change away from E2E_PASSWORD, then immediately back, so the E2E user's credential is unchanged
# once this flow finishes, matching signin.yaml's "leaves the app as it found it" convention.
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      NEW_PASSWORD: ${E2E_PASSWORD}

- tapOn: "Home"
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element: "Sign out"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
